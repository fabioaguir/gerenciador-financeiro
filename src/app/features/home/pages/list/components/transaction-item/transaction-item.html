<mat-card class="card">
    <div>

        <ng-container *isIncome="transaction().type; else isExpense">
            Entrada
        </ng-container>

        <ng-template #isExpense>
            Gastos
        </ng-template>

        <div class="card-title">{{ transaction().title }}</div>
        <div class="card-value">
            <app-transaction-value [transaction]="transaction()" />
        </div>
    </div>
    <div class="card-actions">
        <button matButton="filled" (click)="edit.emit(transaction())">Editar</button>
        <button matButton="filled" matButtonColor="error" (click)="remove.emit(transaction())">Remover</button>
    </div>
</mat-card>
