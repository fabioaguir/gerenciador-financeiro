<app-balance [transactions]="transactions()"></app-balance>
<div class="actions">
    <a matButton="filled" routerLink="create">
        Adicionar transação
    </a>
</div>
<app-transaction-container [transactions]="transactions()">
    <ng-template #item let-item="item">
        <app-transaction-item class="transaction" [transaction]="item" (edit)="edit($event)"
            (remove)="remove($event)" />
    </ng-template>

    <ng-template #noItem>
        <app-no-transaction />
    </ng-template>
</app-transaction-container>
