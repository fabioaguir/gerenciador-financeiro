<form [formGroup]="form()" (ngSubmit)="onSubmit()">
    <div class="m-24">
        <mat-button-toggle-group name="fontStyle" aria-label="Font Style" formControlName="type">
            <mat-button-toggle [value]="typeTransaction.OUTCOME">Gastos</mat-button-toggle>
            <mat-button-toggle [value]="typeTransaction.INCOME">Ganhos</mat-button-toggle>
        </mat-button-toggle-group>

        @if (form().controls.type.hasError('required')) {
        <mat-error>Campo obrigatório</mat-error>
        }
    </div>


    <mat-form-field>
        <mat-label>Título</mat-label>
        <input matInput placeholder="Título da transação" formControlName="title" required>
        @if (form().controls.title.hasError('required')) {
        <mat-error>Campo obrigatório</mat-error>
        }
    </mat-form-field>

    <mat-form-field>
        <mat-label>Valor</mat-label>
        <input matInput placeholder="Valor da transação" formControlName="value" mask="separator.2">
        <span matTextPrefix>R$ &nbsp;</span>
        @if (form().controls.value.hasError('required')) {
        <mat-error>Valor obrigatório</mat-error>
        }
    </mat-form-field>

    <div class="submit-container">
        <button matButton="filled" type="submit" [disabled]="form().invalid">Salvar</button>
    </div>
</form>
