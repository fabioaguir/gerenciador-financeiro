<mat-nav-list>
    @for (link of links(); track link) {
    <a mat-list-item [routerLink]="link.url" routerLinkActive="mat-list-item-active"
        [routerLinkActiveOptions]="{ exact: true }" (click)="closeSidenav()">
        {{
        link.label }}</a>
    }
</mat-nav-list>

<mat-action-list>
    @if (loggedInUser()) {
    <button mat-list-item logout>Sair</button>
    }
</mat-action-list>
