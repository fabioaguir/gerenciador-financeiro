<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-form-field class="w-100 m-24">
        <mat-label>Usuário</mat-label>
        <input matInput placeholder="Nome de usuário" formControlName="user" required>

        @if (form.controls.user.hasError('required')) {
        <mat-error>Campo obrigatório</mat-error>
        }
    </mat-form-field>
    <mat-form-field class="w-100 m-24">
        <mat-label>Senha</mat-label>
        <input matInput type="password" placeholder="Senha" formControlName="password" required>
        @if (form.controls.password.hasError('required')) {
        <mat-error>Campo obrigatório</mat-error>
        }
    </mat-form-field>
    <div class="submit-container">
        <button matButton="filled" type="submit" [disabled]="form.invalid">Salvar</button>
    </div>
</form>
